[package]
name = "herdr-done"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hd"
path = "src/main.rs"

[dependencies]
bonfig = "0.1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29.0"
humantime = "2.4"
notify-rust = "4.19.0"
ratatui = "0.30.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ulid = { version = "3.0.0", features = ["serde"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }

[target."cfg(unix)".dependencies]
nix = { version = "0.32.0", features = ["signal", "process"] }
signal-hook = "0.4.6"

[dev-dependencies]
tempfile = "3.27.0"
figment = { version = "0.10", features = ["test"] }
